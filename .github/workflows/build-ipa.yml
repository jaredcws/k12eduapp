name: Build iPad app (unsigned IPA)

# Builds the Swift Playgrounds app on a macOS runner and publishes an unsigned
# .ipa to a GitHub Release. Install it on the iPad with AltStore / SideStore /
# Sideloadly, which signs it on-device with your Apple ID / Developer account.

on:
  workflow_dispatch:        # lets you run it manually from the Actions tab
  push:
    branches:
      - claude/stoic-bohr-p3lxei
    paths:
      - 'k12eduapp.swiftpm/**'
      - '.github/workflows/build-ipa.yml'

permissions:
  contents: write           # needed to publish the Release with the .ipa

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: List available schemes (for debugging)
        working-directory: k12eduapp.swiftpm
        run: xcodebuild -list || true

      - name: Build app for device (unsigned)
        working-directory: k12eduapp.swiftpm
        run: |
          set -o pipefail
          xcodebuild \
            -scheme k12eduapp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned .ipa
        run: |
          set -e
          PRODUCTS="$GITHUB_WORKSPACE/build/Build/Products/Release-iphoneos"
          APP_PATH=$(find "$PRODUCTS" -maxdepth 1 -name '*.app' | head -n 1)
          echo "Found app: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app was produced — check the build step output."
            ls -la "$PRODUCTS" || true
            exit 1
          fi
          rm -rf "$GITHUB_WORKSPACE/Payload"
          mkdir -p "$GITHUB_WORKSPACE/Payload"
          cp -R "$APP_PATH" "$GITHUB_WORKSPACE/Payload/"
          cd "$GITHUB_WORKSPACE"
          zip -r -q k12eduapp.ipa Payload
          ls -lh k12eduapp.ipa

      - name: Upload .ipa as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: k12eduapp-unsigned-ipa
          path: k12eduapp.ipa
          if-no-files-found: error

      - name: Publish .ipa to a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-build
          name: Latest iPad build (unsigned)
          body: |
            Unsigned IPA built from the latest commit on the development branch.

            Install on the iPad with AltStore / SideStore / Sideloadly — these
            sign the app on-device with your Apple ID / Developer account.
          files: k12eduapp.ipa
          prerelease: true
